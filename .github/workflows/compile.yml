name: Compile

# Rebuilds compiled/ whenever a project's knowledge changes (the relay writes projects/<id>/).
on:
  push:
    branches: [main]
    paths: ["projects/**", "scripts/compile.js"]
  workflow_dispatch:

permissions:
  contents: write

# The relay writes two files per project; only the last run needs to finish.
concurrency:
  group: compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/compile.js
      - name: Commit compiled/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiled
          git diff --cached --quiet || git commit -m "Compile knowledge"
          git pull --rebase origin main
          git push
